name: SCENTIQ Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scentiq
          POSTGRES_PASSWORD: scentiq_test_secret
          POSTGRES_DB: scentiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint Backend
        working-directory: ./apps/api
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Alembic Migrations
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql+psycopg2://scentiq:scentiq_test_secret@localhost:5432/scentiq_test
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql+psycopg2://scentiq:scentiq_test_secret@localhost:5432/scentiq_test
          TEST_DATABASE_URL: sqlite:///:memory:
        run: |
          pytest tests -v --durations=10

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: |
          npm ci || npm install

      - name: Type Check & Build
        working-directory: ./apps/web
        run: |
          npm run build

